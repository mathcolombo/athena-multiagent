<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skynet Loja</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --text: #1d2330; --muted: #5f6b7a; --border: #dde1e7;
    --accent: #2f5bd3; --ok: #1f7a4d; --warn: #9a6200; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --surface: #1d2128; --text: #e6e9ee; --muted: #9aa4b2; --border: #2e343d;
      --accent: #7c9cf0; --ok: #5cc28f; --warn: #e0a84a; --err: #f08a82; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header label { color: var(--muted); }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; padding: 16px; }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-width: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  input { font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 0; }
  input.qty { width: 64px; }
  input.money { width: 100px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 13px; }
  .status-CONFIRMED { color: var(--ok); } .status-PENDING { color: var(--warn); } .status-REJECTED, .status-CANCELLED { color: var(--err); }
  #toast { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 480px; padding: 10px 14px; border-radius: 6px; background: var(--text); color: var(--bg); display: none; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>Skynet Loja (homologação)</h1>
  <label>Cliente <input id="customer" value="cliente-demo"></label>
  <button class="ghost" id="refresh">Atualizar tudo</button>
</header>
<main>
  <section>
    <h2>Catálogo</h2>
    <form id="product-form">
      <input name="name" placeholder="Nome" required>
      <input name="price" class="money" placeholder="Preço (R$)" inputmode="decimal" required>
      <input name="stock" class="qty" placeholder="Estoque" inputmode="numeric" required>
      <button>Cadastrar</button>
    </form>
    <table>
      <thead><tr><th>Produto</th><th class="num">Preço</th><th class="num">Estoque</th><th></th></tr></thead>
      <tbody id="products"></tbody>
    </table>
  </section>

  <section>
    <h2>Carrinho</h2>
    <p class="muted" id="cart-info">Nenhum carrinho aberto.</p>
    <table>
      <thead><tr><th>Item</th><th class="num">Qtd.</th><th class="num">Unitário</th><th></th></tr></thead>
      <tbody id="cart-items"></tbody>
    </table>
    <p><strong>Total: <span id="cart-total">R$ 0,00</span></strong></p>
    <div class="row-actions">
      <button id="checkout">Finalizar compra</button>
      <button class="ghost" id="new-cart">Novo carrinho</button>
    </div>
  </section>

  <section>
    <h2>Pedidos</h2>
    <p class="muted">Os pedidos são criados por eventos, então podem levar alguns segundos para aparecer e mudar de status.</p>
    <table>
      <thead><tr><th>Pedido</th><th>Status</th><th class="num">Total</th></tr></thead>
      <tbody id="orders"></tbody>
    </table>
  </section>
</main>
<div id="toast" role="status"></div>

<script>
const money = cents => (cents / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const toCents = text => Math.round(parseFloat(String(text).replace(/\./g, "").replace(",", ".")) * 100);
const $ = id => document.getElementById(id);
const customer = () => $("customer").value.trim() || "cliente-demo";
const CART_KEY = "skynet-cart-id";

function storedCart() { try { return localStorage.getItem(CART_KEY); } catch { return null; } }
function storeCart(id) { try { id ? localStorage.setItem(CART_KEY, id) : localStorage.removeItem(CART_KEY); } catch {} }

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (el.style.display = "none"), 4000);
}

async function api(service, path, options = {}) {
  const response = await fetch(`/api/${service}${path}`, {
    headers: { "Content-Type": "application/json" },
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await response.json().catch(() => null);
  if (!response.ok) throw new Error(data?.detail ? JSON.stringify(data.detail) : `HTTP ${response.status}`);
  return data;
}

function cell(text, className) {
  const td = document.createElement("td");
  td.textContent = text;
  if (className) td.className = className;
  return td;
}

function button(label, onClick, ghost = true) {
  const b = document.createElement("button");
  b.textContent = label;
  if (ghost) b.className = "ghost";
  b.addEventListener("click", onClick);
  return b;
}

async function loadProducts() {
  const products = await api("catalog", "/products");
  const body = $("products");
  body.replaceChildren();
  for (const product of products) {
    const row = document.createElement("tr");
    row.append(cell(product.name), cell(money(product.price_cents), "num"), cell(product.stock, "num"));
    const actions = document.createElement("td");
    actions.className = "row-actions";
    actions.append(
      button("Adicionar", () => addToCart(product.id)),
      button("Alterar preço", () => changePrice(product)),
      button("Estoque", () => changeStock(product)),
    );
    row.append(actions);
    body.append(row);
  }
  if (!products.length) body.innerHTML = '<tr><td colspan="4" class="muted">Nenhum produto cadastrado.</td></tr>';
}

async function ensureCart() {
  let id = storedCart();
  if (id) {
    try {
      const cart = await api("cart", `/carts/${id}`);
      if (cart.status === "OPEN") return id;
    } catch {}
  }
  id = (await api("cart", "/carts", { method: "POST", body: { customer_id: customer() } })).id;
  storeCart(id);
  return id;
}

async function loadCart() {
  const id = storedCart();
  const body = $("cart-items");
  body.replaceChildren();
  if (!id) { $("cart-info").textContent = "Nenhum carrinho aberto."; $("cart-total").textContent = money(0); return; }
  let cart;
  try { cart = await api("cart", `/carts/${id}`); } catch { storeCart(null); return loadCart(); }
  $("cart-info").textContent = `Carrinho ${id.slice(0, 8)} · ${cart.status === "OPEN" ? "aberto" : "finalizado"}`;
  for (const item of cart.items) {
    const row = document.createElement("tr");
    row.append(cell(item.name), cell(item.quantity, "num"), cell(money(item.unit_price_cents), "num"));
    const actions = document.createElement("td");
    if (cart.status === "OPEN") actions.append(button("Remover", () => removeItem(item.product_id)));
    row.append(actions);
    body.append(row);
  }
  $("cart-total").textContent = money(cart.total_cents);
}

async function loadOrders() {
  const orders = await api("orders", `/orders?customer_id=${encodeURIComponent(customer())}`);
  const body = $("orders");
  body.replaceChildren();
  for (const order of orders) {
    const row = document.createElement("tr");
    row.append(cell(order.id.slice(0, 8)), cell(order.status, `status-${order.status}`), cell(money(order.total_cents), "num"));
    if (order.rejection_reason) row.title = order.rejection_reason;
    body.append(row);
  }
  if (!orders.length) body.innerHTML = '<tr><td colspan="3" class="muted">Nenhum pedido deste cliente.</td></tr>';
}

async function addToCart(productId) {
  try {
    const id = await ensureCart();
    const cart = await api("cart", `/carts/${id}`);
    const current = cart.items.find(item => item.product_id === productId)?.quantity ?? 0;
    await api("cart", `/carts/${id}/items`, { method: "PUT", body: { product_id: productId, quantity: current + 1 } });
    await loadCart();
  } catch (error) { toast(`Não foi possível adicionar: ${error.message}`); }
}

async function removeItem(productId) {
  try {
    await api("cart", `/carts/${storedCart()}/items/${productId}`, { method: "DELETE" });
    await loadCart();
  } catch (error) { toast(error.message); }
}

async function changePrice(product) {
  const answer = prompt(`Novo preço de ${product.name} (R$)`, (product.price_cents / 100).toFixed(2).replace(".", ","));
  if (answer === null) return;
  try {
    await api("catalog", `/products/${product.id}`, { method: "PATCH", body: { price_cents: toCents(answer) } });
    await refresh();
    toast("Preço alterado no catálogo. Confira se o carrinho recebeu o novo preço.");
  } catch (error) { toast(error.message); }
}

async function changeStock(product) {
  const answer = prompt(`Novo estoque de ${product.name}`, product.stock);
  if (answer === null) return;
  try {
    await api("catalog", `/products/${product.id}`, { method: "PATCH", body: { stock: parseInt(answer, 10) } });
    await loadProducts();
  } catch (error) { toast(error.message); }
}

async function refresh() {
  await Promise.all([loadProducts(), loadCart(), loadOrders()]).catch(error => toast(error.message));
}

$("product-form").addEventListener("submit", async event => {
  event.preventDefault();
  const form = new FormData(event.target);
  try {
    await api("catalog", "/products", {
      method: "POST",
      body: { name: form.get("name"), price_cents: toCents(form.get("price")), stock: parseInt(form.get("stock"), 10) },
    });
    event.target.reset();
    await loadProducts();
  } catch (error) { toast(`Cadastro inválido: ${error.message}`); }
});

$("checkout").addEventListener("click", async () => {
  const id = storedCart();
  if (!id) return toast("Adicione itens ao carrinho primeiro.");
  try {
    await api("cart", `/carts/${id}/checkout`, { method: "POST" });
    storeCart(null);
    await refresh();
    toast("Compra finalizada. Acompanhe o pedido.");
  } catch (error) { toast(`Checkout recusado: ${error.message}`); }
});

$("new-cart").addEventListener("click", () => { storeCart(null); loadCart(); });
$("refresh").addEventListener("click", refresh);
$("customer").addEventListener("change", () => { storeCart(null); refresh(); });

refresh();
setInterval(() => Promise.all([loadOrders(), loadProducts()]).catch(() => {}), 3000);
</script>
</body>
</html>
